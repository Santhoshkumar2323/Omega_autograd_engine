<svg viewBox="0 0 1120 1276" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="1276" fill="#ffffff"/>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
  </marker>
</defs>

<text x="560.0" y="46" text-anchor="middle" font-size="25" font-weight="800" fill="#111827">omega-autograd-engine — How It's Built</text>
<text x="560.0" y="70" text-anchor="middle" font-size="13.5" fill="#6b7280">A deep learning framework built from scratch in NumPy — each layer below is built directly on top of the one above it</text>
<text x="560.0" y="90" text-anchor="middle" font-size="11.5" fill="#9ca3af">(pill under each box = the source file that does it)</text>
<text x="90" y="118" font-size="13" font-weight="800" letter-spacing="1.1" fill="#4338ca" font-family="Helvetica,Arial,sans-serif">LAYER 1 — THE CORE ENGINE (EVERYTHING ELSE DEPENDS ON THIS)</text>
<rect x="90" y="142" width="940" height="156" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.8"/>
<text x="560.0" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1b4b" font-family="Helvetica,Arial,sans-serif">Tensor class with automatic differentiation</text>
<text x="560.0" y="198" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Tracks data + gradients, builds the computation graph as operations run, and walks it backward to compute every gradient. Also</text>
<text x="560.0" y="216" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">provides the basic building-block operations (add, multiply, matmul, reshape, transpose, indexing) and simple activations (ReLU,</text>
<text x="560.0" y="234" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">softmax, sigmoid, tanh).</text>
<rect x="398.25" y="247" width="323.5" height="26" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="1.2" opacity="0.9"/>
<text x="560.0" y="262" text-anchor="middle" font-size="11.5" fill="#4338ca" font-family="Menlo,Consolas,monospace" font-weight="600">tensor.py + ops.py · exported via __init__.py</text>
<line x1="560.0" y1="298" x2="560.0" y2="338" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="499.6" y="308.0" width="120.80000000000001" height="18" fill="#ffffff"/>
<text x="560.0" y="322.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Helvetica,Arial,sans-serif">built on top of ↓</text>
<text x="90" y="338" font-size="13" font-weight="800" letter-spacing="1.1" fill="#0369a1" font-family="Helvetica,Arial,sans-serif">LAYER 2 — ATTENTION MATH AND MEMORY-SAVING TRICKS</text>
<rect x="95.0" y="362" width="450" height="137" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="320.0" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e" font-family="Helvetica,Arial,sans-serif">Attention building blocks</text>
<text x="320.0" y="416" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Scaled dot-product attention, masked softmax, layer norm,</text>
<text x="320.0" y="434" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">and GELU — the pieces a Transformer needs</text>
<rect x="255.4" y="447" width="129.2" height="26" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.2" opacity="0.9"/>
<text x="320.0" y="462" text-anchor="middle" font-size="11.5" fill="#0369a1" font-family="Menlo,Consolas,monospace" font-weight="600">attention_ops.py</text>
<rect x="575.0" y="362" width="450" height="137" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
<text x="800.0" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e" font-family="Helvetica,Arial,sans-serif">Memory-saving alternatives</text>
<text x="800.0" y="416" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Flash Attention (fixed memory regardless of sequence length)</text>
<text x="800.0" y="434" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">and gradient checkpointing (recomputes instead of storing)</text>
<rect x="661.7" y="447" width="276.6" height="26" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="1.2" opacity="0.9"/>
<text x="800.0" y="462" text-anchor="middle" font-size="11.5" fill="#0369a1" font-family="Menlo,Consolas,monospace" font-weight="600">flash_attention.py + checkpoint_ops.py</text>
<line x1="560.0" y1="499" x2="560.0" y2="539" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="499.6" y="509.0" width="120.80000000000001" height="18" fill="#ffffff"/>
<text x="560.0" y="523.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Helvetica,Arial,sans-serif">built on top of ↓</text>
<text x="90" y="539" font-size="13" font-weight="800" letter-spacing="1.1" fill="#7e22ce" font-family="Helvetica,Arial,sans-serif">LAYER 3 — READY-TO-USE NEURAL NETWORK LAYERS</text>
<rect x="90" y="563" width="940" height="120" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="560.0" y="594" text-anchor="middle" font-size="17" font-weight="700" fill="#3b0764" font-family="Helvetica,Arial,sans-serif">Linear, Embedding, LayerNorm, Multi-Head Attention, Feed-Forward, and a full Transformer block</text>
<text x="560.0" y="619" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Assembles Layers 1 and 2 into the actual pieces a model is built from</text>
<rect x="532.25" y="632" width="55.5" height="26" rx="10" fill="#ffffff" stroke="#7e22ce" stroke-width="1.2" opacity="0.9"/>
<text x="560.0" y="647" text-anchor="middle" font-size="11.5" fill="#7e22ce" font-family="Menlo,Consolas,monospace" font-weight="600">nn.py</text>
<line x1="560.0" y1="683" x2="560.0" y2="723" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="502.8" y="693.0" width="114.4" height="18" fill="#ffffff"/>
<text x="560.0" y="707.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Helvetica,Arial,sans-serif">used alongside ↓</text>
<text x="90" y="723" font-size="13" font-weight="800" letter-spacing="1.1" fill="#be185d" font-family="Helvetica,Arial,sans-serif">LAYER 4 — WHAT YOU NEED TO ACTUALLY TRAIN SOMETHING</text>
<rect x="95.0" y="747" width="450" height="137" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
<text x="320.0" y="777" text-anchor="middle" font-size="16" font-weight="700" fill="#831843" font-family="Helvetica,Arial,sans-serif">Optimizers</text>
<text x="320.0" y="801" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">SGD (with momentum), Adam, and AdamW — update the weights</text>
<text x="320.0" y="819" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">using the gradients Layer 1 computed</text>
<rect x="265.45" y="832" width="109.10000000000001" height="26" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="1.2" opacity="0.9"/>
<text x="320.0" y="847" text-anchor="middle" font-size="11.5" fill="#be185d" font-family="Menlo,Consolas,monospace" font-weight="600">optimizers.py</text>
<rect x="575.0" y="747" width="450" height="137" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
<text x="800.0" y="777" text-anchor="middle" font-size="16" font-weight="700" fill="#831843" font-family="Helvetica,Arial,sans-serif">Data loading</text>
<text x="800.0" y="801" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Character tokenizer + batching for text, digit-image loading</text>
<text x="800.0" y="819" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">+ batching for the MLP example</text>
<rect x="765.55" y="832" width="68.9" height="26" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="1.2" opacity="0.9"/>
<text x="800.0" y="847" text-anchor="middle" font-size="11.5" fill="#be185d" font-family="Menlo,Consolas,monospace" font-weight="600">data.py</text>
<line x1="560.0" y1="884" x2="560.0" y2="924" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="461.2" y="894.0" width="197.60000000000002" height="18" fill="#ffffff"/>
<text x="560.0" y="908.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Helvetica,Arial,sans-serif">all of the above feeds into ↓</text>
<text x="90" y="924" font-size="13" font-weight="800" letter-spacing="1.1" fill="#15803d" font-family="Helvetica,Arial,sans-serif">THREE WAYS ALL OF THIS ACTUALLY GETS USED</text>
<rect x="55.0" y="948" width="320" height="174" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="215.0" y="977" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="Helvetica,Arial,sans-serif">Train a real model</text>
<text x="215.0" y="1000" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">A small MLP on digit images, and a tiny</text>
<text x="215.0" y="1018" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">character-level Transformer that</text>
<text x="215.0" y="1036" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">generates text</text>
<rect x="137.0" y="1049" width="156.0" height="46" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.2" opacity="0.9"/>
<text x="215.0" y="1064" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">train_mnist.py +</text>
<text x="215.0" y="1084" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">train_transformer.py</text>
<rect x="400.0" y="948" width="320" height="214" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="560.0" y="977" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="Helvetica,Arial,sans-serif">Prove it's correct</text>
<text x="560.0" y="1000" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Every custom gradient is checked against</text>
<text x="560.0" y="1018" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">finite-difference math, plus a direct</text>
<text x="560.0" y="1036" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">comparison against real PyTorch</text>
<rect x="435.1" y="1049" width="249.8" height="86" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.2" opacity="0.9"/>
<text x="560.0" y="1064" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">test_engine.py, test_attention.py,</text>
<text x="560.0" y="1084" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">test_flash_attention.py,</text>
<text x="560.0" y="1104" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">test_checkpoint.py,</text>
<text x="560.0" y="1124" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">compare_pytorch.py</text>
<rect x="745.0" y="948" width="320" height="194" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="905.0" y="977" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d" font-family="Helvetica,Arial,sans-serif">Measure it</text>
<text x="905.0" y="1000" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Times forward/backward passes, proves</text>
<text x="905.0" y="1018" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">Flash Attention's memory stays flat vs.</text>
<text x="905.0" y="1036" text-anchor="middle" font-size="13" fill="#4b5563" font-family="Helvetica,Arial,sans-serif">naive attention, and renders every plot</text>
<rect x="800.2" y="1049" width="209.6" height="66" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.2" opacity="0.9"/>
<text x="905.0" y="1064" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">profiling.py,</text>
<text x="905.0" y="1084" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">benchmark_flash_vs_naive.py,</text>
<text x="905.0" y="1104" text-anchor="middle" font-size="11.5" fill="#15803d" font-family="Menlo,Consolas,monospace" font-weight="600">visualize.py</text>
<line x1="90" y1="1192" x2="1030" y2="1192" stroke="#e5e7eb" stroke-width="1"/>
<text x="560.0" y="1216" text-anchor="middle" font-size="12" fill="#9ca3af" font-family="Helvetica,Arial,sans-serif">compare_pytorch.py and visualize.py additionally reach back into every layer above to verify or plot it — not drawn as arrows, to keep this readable</text>
</svg>